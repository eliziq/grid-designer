<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Grid Designer - Vanilla JS Starter</title>
		<link rel="stylesheet" href="main.css" />
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>
	</head>
	<body>
		<dialog id="confirm-dialog"></dialog>
		<header>
			<h1>Grid Designer</h1>
			<p>Drag/drop to design grid layouts and export CSS.</p>
		</header>

		<section>
			<h2>Resolutions</h2>
			<div id="resolutionTabs">
				<div class="resolution-group" data-resolution-type="grid">
					<div class="resolution-group-caption">GRID</div>
					<div class="resolution-group-options"></div>
				</div>
				<div class="resolution-group" data-resolution-type="mobile">
					<div class="resolution-group-caption">MOBILE</div>
					<div class="resolution-group-options"></div>
				</div>
				<div class="resolution-group" data-resolution-type="custom">
					<div class="resolution-group-caption">CUSTOM</div>
					<div class="resolution-group-options"></div>
				</div>
			</div>
		</section>

		<section id="tagSelectionPanel" class="tag-selector">
			<details id="tagSelectorDetails" class="tag-selector__details" open>
				<summary class="tag-selector__summary">
					<span class="tag-selector__title"
						>Pick elements you want to add to the card</span
					>
					<span id="tagSelectorMeta" class="tag-selector__meta"></span>
				</summary>
				<div class="tag-selector__body">
					<div id="tagSelectorList" class="tag-selector__list"></div>
					<div class="tag-selector__actions">
						<button id="tagSelectionSave" type="button">Save selected tags</button>
						<button id="tagSelectionEdit" type="button" style="display: none">
							Edit selection
						</button>
					</div>
				</div>
			</details>
		</section>

		<section id="elements">
			<div id="elementList"></div>
			<div id="unfinishedDesignNotice" class="tag-selector__notice" hidden>
				This design is not finished yet. Place all selected elements before it can be saved.
			</div>
		</section>

		<section id="controls">
			<div id="responsiveSettings">
				<label>
					Layout:
					<select id="mainMaxWidth"></select>
				</label>

				<label>
					Columns:
					<input id="colCount" type="number" min="1" max="24" />
				</label>

				<label>
					Rows:
					<input id="rowCount" type="number" value="4" min="1" max="20" />
				</label>

				<div class="control-field">
					<span class="control-label">Justify content:</span>
					<fieldset class="icon-radio-group" aria-label="Justify content">
						<label class="icon-radio" title="Start">
							<input type="radio" name="justifyContent" value="start" />
							<span class="material-symbols-outlined" aria-hidden="true"
								>format_align_left</span
							>
						</label>
						<label class="icon-radio" title="Center">
							<input type="radio" name="justifyContent" value="center" />
							<span class="material-symbols-outlined" aria-hidden="true"
								>format_align_center</span
							>
						</label>
						<label class="icon-radio" title="End">
							<input type="radio" name="justifyContent" value="end" />
							<span class="material-symbols-outlined" aria-hidden="true"
								>format_align_right</span
							>
						</label>
					</fieldset>
				</div>

				<div class="control-field">
					<span class="control-label">Align items:</span>
					<fieldset class="icon-radio-group" aria-label="Align items">
						<label class="icon-radio" title="Start">
							<input type="radio" name="alignItems" value="start" />
							<span class="material-symbols-outlined" aria-hidden="true"
								>vertical_align_top</span
							>
						</label>
						<label class="icon-radio" title="Center">
							<input type="radio" name="alignItems" value="center" checked />
							<span class="material-symbols-outlined" aria-hidden="true"
								>vertical_align_center</span
							>
						</label>
						<label class="icon-radio" title="End">
							<input type="radio" name="alignItems" value="end" />
							<span class="material-symbols-outlined" aria-hidden="true"
								>vertical_align_bottom</span
							>
						</label>
					</fieldset>
				</div>
			</div>

			<div class="control-actions">
				<button id="buildGrid">Update grid</button>
				<button id="clearGrid">Clear all elements</button>
				<button id="loadDesign">Load Design</button>
				<input type="file" id="importState" accept=".json" style="display: none" />
				<button id="exportCss">Export CSS</button>
				<button id="exportJson">Export JSON</button>
			</div>
		</section>

		<section id="gridWrapper">
			<div id="grid" class="grid"></div>
		</section>

		<section id="rowControls">
			<h2>Row Heights</h2>
			<div id="controlsContainer"></div>
		</section>

		<section id="output">
			<h2>Generated CSS</h2>
			<pre id="cssCode"></pre>
		</section>

		<!-- <script src="script.js"></script> -->
		<script src="grid-designer-class.js"></script>
		<script src="confirm-dialog.js"></script>
		<script src="grid-designer-complex-tags.js"></script>
		<script src="grid-designer-state.js"></script>
		<script src="grid-designer-resolutions.js"></script>
		<script src="grid-designer-css.js"></script>
		<script src="grid-designer-layout.js"></script>
		<script src="grid-designer-render.js"></script>
		<script src="grid-designer-area-layout-controls-class.js"></script>
		<script src="grid-designer-tag-layout-controls.js"></script>
		<script src="grid-designer-tag-panel.js"></script>
		<script src="grid-designer-interactions.js"></script>
		<script src="grid-designer-pointer.js"></script>
		<script src="grid-designer-api.js"></script>
		<script src="use-script.js"></script>
	</body>
</html>
