<style>
	.element-test {
		background-color: rgb(172, 203, 174);
		padding: 8px;
		margin: 8px;
	}
	.grid-test {
		display: grid;
		height: 70vh;
		grid-template-columns: repeat(6, 1fr);
		grid-template-rows: max-content 1fr 1fr max-content;
		align-items: stretch;
		justify-items: stretch;
		grid-template-areas:
			"area1 area1 area1 area-3 area-3 area-3"
			"area2 area2 area2 area-3 area-3 area-3"
			"area4 area4 area4 area5 area5 area5"
			"area6 area6 area6 area6 area6 area6";
		background-color: lightgray;
		padding: 8px;
		margin: 8px;
	}
	.area1 {
		grid-area: area1;
	}
	.area2 {
		grid-area: area2;
	}
	.area-3 {
		grid-area: area-3;
	}
	.area4 {
		grid-area: area4;
	}
	.area5 {
		grid-area: area5;
	}
	.area6 {
		grid-area: area6;
	}
	.grid-test > [style*="grid-area: area1"] {
		background-color: rgb(255, 0, 0);
	}
	.name-emblem {
		display: grid;
		width: 100%;
		padding: 24px 32px;
		gap: 16px;
		align-items: center;
		justify-items: center;
		color: #111;
		background: #fff;
		border: 1px solid #ddd;
		font-family: Arial, sans-serif;
	}
	.name-emblem > .home-team-name,
	.name-emblem > .away-team-name,
	.name-emblem > .versus {
		font-size: 72px;
		line-height: 1;
	}

	.name-emblem > .home-team-emblem,
	.name-emblem > .away-team-emblem {
		width: 220px;
		height: 220px;
		border-radius: 50%;
		background: #aaa;
	}

	.name-emblem > .home-team-name {
		grid-area: hometeamneme;
	}

	.name-emblem > .away-team-name {
		grid-area: awayteamname;
	}

	.name-emblem > .versus {
		grid-area: versus;
	}

	.name-emblem > .home-team-emblem {
		grid-area: hometeamemblem;
	}

	.name-emblem > .away-team-emblem {
		grid-area: awayteamemblem;
	}

	.name-emblem {
		display: grid;
		align-items: center;
	}

	.name-emblem.preset1 {
		grid-template-columns: 1fr auto 1fr;
		grid-template-rows: 1fr auto;
		grid-template-areas:
			"hometeamemblem versus awayteamemblem"
			"hometeamneme versus awayteamname";
	}

	.name-emblem.preset2 {
		grid-template-columns: 1fr auto 1fr;
		grid-template-rows: auto 1fr;
		grid-template-areas:
			"hometeamneme versus awayteamname"
			"hometeamemblem versus awayteamemblem";
	}

	.name-emblem.preset3 {
		grid-template-columns: auto 1fr auto 1fr auto;
		grid-template-rows: auto;
		grid-template-areas: "hometeamneme hometeamemblem versus awayteamemblem awayteamname";
	}

	.name-emblem.preset4 {
		grid-template-columns: 1fr auto auto auto 1fr;
		grid-template-rows: auto;
		grid-template-areas: "hometeamemblem hometeamneme versus awayteamname awayteamemblem";
	}
</style>

<section class="grid-test">
	<div class="element-test area1"><div>complex nested element</div></div>
	<div class="element-test area2">random text1</div>
	<button class="element-test area-3">random text2</button>
	<p class="element-test area4">random text3</p>
	<span class="element-test area5">random text4</span>
	<div class="element-test area6">random text5</div>
</section>

<div class="name-emblem preset1 preset2">
	<span class="home-team-name">Athletic Madrid</span>
	<span class="away-team-name">Paris FC</span>
	<span class="versus">vs</span>
	<div class="home-team-emblem"></div>
	<div class="away-team-emblem"></div>
